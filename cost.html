<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Sales Cost Calculator</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <script>
    function doDiscount() {
      var number = Number(document.getElementById("numberItems").value);
      var cost = Number(document.getElementById("itemCost").value);
      var discountRate = Number(document.getElementById("discountRate").value);
      var discountAt = Number(document.getElementById("numberForDiscount").value);
      var costs = "";

      for (var i = 1; i <= 5; i++) {
        var checkCount = i * number;
        var total;

        if (checkCount <= discountAt) {
          total = checkCount * cost;
        } else {
          total = discountAt * cost +
                   (checkCount - discountAt) * cost * (1 - discountRate);
        }

        costs += "checkCount " + checkCount + " is " + total + "; ";
      }

      document.getElementById("costResults").innerHTML =
        "Costs are: " + costs;
    }


    function chooseOp() {
      var count = Number(document.getElementById("numberItems").value);
      var discountAt = Number(document.getElementById("numberForDiscount").value);
      var op = document.querySelector('input[name="op"]:checked').value;
      var text = "";

      switch (op) {
        case "mul":
          text = count + " times " + discountAt + " is " +
                 (count * discountAt);
          break;

        case "add":
          text = count + " plus " + discountAt + " is " +
                 (count + discountAt);
          break;

        case "div":
          text = count + " divided by " + discountAt + " is " +
                 (count / discountAt);
          break;
      }

      document.getElementById("opResults").innerHTML = text;
    }
  </script>
</head>

<body class="bg-light">

  <div class="container mt-5 mb-5">

    <!-- Main heading -->
    <h1 class="text-center mb-4">
      Pranav Torti Sales Computation
    </h1>


    <!-- Sales calculation card -->
    <div class="card shadow p-4">

      <h2 class="text-center mb-4">
        Sales Cost Calculator
      </h2>

      <form onsubmit="return false;">

        <!-- Number of items -->
        <div class="mb-3">
          <label for="numberItems" class="form-label">
            Enter number items
          </label>

          <input
            type="number"
            id="numberItems"
            value="1"
            class="form-control"
          >
        </div>


        <!-- Cost of one item -->
        <div class="mb-3">
          <label for="itemCost" class="form-label">
            Enter the cost of one item
          </label>

          <input
            type="number"
            id="itemCost"
            value="20.0"
            step="any"
            class="form-control"
          >
        </div>


        <!-- Discount number -->
        <div class="mb-3">
          <label for="numberForDiscount" class="form-label">
            Enter number to get discount
          </label>

          <input
            type="number"
            id="numberForDiscount"
            value="10"
            class="form-control"
          >
        </div>


        <!-- Discount rate -->
        <div class="mb-3">
          <label for="discountRate" class="form-label">
            Enter the discount rate
          </label>

          <input
            type="number"
            id="discountRate"
            value="0.15"
            step="any"
            class="form-control"
          >
        </div>


        <!-- Show costs button -->
        <div class="d-grid">
          <button
            type="button"
            onclick="doDiscount()"
            class="btn btn-primary"
          >
            Show costs
          </button>
        </div>

      </form>


      <!-- Cost results -->
      <div
        id="costResults"
        class="alert alert-info mt-4"
      >
        Costs will appear here.
      </div>

    </div>


    <!-- Operations card -->
    <div class="card shadow p-4 mt-4">

      <h2 class="text-center mb-4">
        Pick an Operation
      </h2>

      <form onsubmit="return false;">

        <div class="d-flex justify-content-center gap-4">

          <!-- Product -->
          <div class="form-check">
            <input
              type="radio"
              name="op"
              id="opMul"
              value="mul"
              onclick="chooseOp()"
              class="form-check-input"
            >

            <label for="opMul" class="form-check-label">
              Product
            </label>
          </div>


          <!-- Sum -->
          <div class="form-check">
            <input
              type="radio"
              name="op"
              id="opAdd"
              value="add"
              onclick="chooseOp()"
              class="form-check-input"
            >

            <label for="opAdd" class="form-check-label">
              Sum
            </label>
          </div>


          <!-- Divide -->
          <div class="form-check">
            <input
              type="radio"
              name="op"
              id="opDiv"
              value="div"
              onclick="chooseOp()"
              class="form-check-input"
            >

            <label for="opDiv" class="form-check-label">
              Divide
            </label>
          </div>

        </div>

      </form>


      <!-- Operation results -->
      <div
        id="opResults"
        class="alert alert-success text-center mt-4"
      >
        Choose an operation above.
      </div>

    </div>

  </div>

</body>
</html>

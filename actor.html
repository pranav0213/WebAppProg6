<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Actor Guessing Game</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <script>
    // Part 3: global counters
    var correct = 0;
    var notCorrect = 0;

    function checkActor() {
      var actor = document.getElementById("actor").value;
      var guess = document.getElementById("guess").value;

      if (actor === guess) {
        correct++;
        alert("That's right");
      } else {
        notCorrect++;
        alert("Better luck next time");
      }

      document.getElementById("results").innerHTML =
        "Correct: " + correct + " | Not correct: " + notCorrect;

      // Bonus: after more than 10 wrong guesses,
      // change the button to call tooManyGuesses()
      if (notCorrect > 10) {
        document.getElementById("guessButton").onclick = tooManyGuesses;
      }
    }

    // Bonus function
    function tooManyGuesses() {
      alert("Sorry, too many wrong guesses.");
    }


    // Part 4: cycle through three food images
    var usePic = 1;

    function updatePic() {
      var pic = document.getElementById("foodPic");

      switch (usePic) {
        case 1:
          pic.src = "food1.png";
          usePic = 2;
          break;

        case 2:
          pic.src = "food2.png";
          usePic = 3;
          break;

        case 3:
          pic.src = "food3.png";
          usePic = 1;
          break;
      }
    }
  </script>
</head>

<body class="bg-light">

  <!-- Main container -->
  <div class="container mt-5 mb-5">

    <!-- Heading -->
    <h1 class="text-center mb-4">
      Actors by Pranav Torti
    </h1>

    <!-- Actor guessing card -->
    <div class="card shadow p-4">

      <h2 class="text-center mb-4">
        Actor Guessing Game
      </h2>

      <form onsubmit="return false;">

        <!-- Secret actor -->
        <div class="mb-3">
          <label for="actor" class="form-label">
            Peter Pan
          </label>

          <input
            type="password"
            id="actor"
            value="Robin Williams"
            class="form-control"
          >
        </div>

        <!-- Guess -->
        <div class="mb-3">
          <label for="guess" class="form-label">
            Who is the actor
          </label>

          <input
            type="text"
            id="guess"
            class="form-control"
          >
        </div>

        <!-- Button -->
        <div class="d-grid">
          <button
            type="button"
            id="guessButton"
            onclick="checkActor()"
            class="btn btn-primary"
          >
            Check the guess
          </button>
        </div>

      </form>

      <!-- Results -->
      <div
        id="results"
        class="alert alert-info text-center mt-4"
      >
        Correct: 0 | Not correct: 0
      </div>

    </div>

    <!-- Food image section -->
    <div class="card shadow p-4 mt-4 text-center">

      <h2 class="mb-3">
        Favorite Food
      </h2>

      <p class="text-muted">
        Click the image to change the food.
      </p>

      <div id="picContainer">

        <img
          id="foodPic"
          src="food3.png"
          width="150"
          height="150"
          onclick="updatePic()"
          alt="Favorite food"
          class="img-thumbnail"
        >

      </div>

    </div>

  </div>

</body>
</html>

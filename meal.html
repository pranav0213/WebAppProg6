<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Meal Planner</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <script>
    // Part 7
    var my_meal_plan = {};

    function choices() {
      my_meal_plan = {};

      my_meal_plan.breakfast =
        document.getElementById("breakfast").checked;

      my_meal_plan.lunch =
        document.getElementById("lunch").checked;

      my_meal_plan.dinner =
        document.getElementById("dinner").checked;

      document.getElementById("mealResults").innerHTML =
        JSON.stringify(my_meal_plan);
    }


    // Part 8
    function updateMeal() {
      var cuisine =
        document.getElementById("cuisine").value;

      var beverage =
        document.getElementById("beverage").value;

      my_meal_plan["cuisine"] = cuisine;
      my_meal_plan["beverage"] = beverage;

      document.getElementById("mealResults").innerHTML =
        JSON.stringify(my_meal_plan);
    }
  </script>

</head>

<body class="bg-light">

  <div class="container mt-5 mb-5">

    <!-- Page heading -->
    <h1 class="text-center mb-4">
      Pranav Torti Meal Planner
    </h1>


    <!-- Meal choices card -->
    <div class="card shadow p-4">

      <h2 class="text-center mb-4">
        Select Meals
      </h2>

      <form onsubmit="return false;">

        <div class="d-flex justify-content-center gap-4 mb-4">

          <!-- Breakfast -->
          <div class="form-check">
            <input
              type="checkbox"
              id="breakfast"
              value="True"
              class="form-check-input"
            >

            <label
              for="breakfast"
              class="form-check-label"
            >
              Breakfast
            </label>
          </div>


          <!-- Lunch -->
          <div class="form-check">
            <input
              type="checkbox"
              id="lunch"
              value="False"
              class="form-check-input"
            >

            <label
              for="lunch"
              class="form-check-label"
            >
              Lunch
            </label>
          </div>


          <!-- Dinner -->
          <div class="form-check">
            <input
              type="checkbox"
              id="dinner"
              value="True"
              class="form-check-input"
            >

            <label
              for="dinner"
              class="form-check-label"
            >
              Dinner
            </label>
          </div>

        </div>


        <!-- Meal Plan Choices button -->
        <div class="d-grid">
          <button
            type="button"
            onclick="choices()"
            class="btn btn-primary"
          >
            Meal Plan Choices
          </button>
        </div>

      </form>

    </div>


    <!-- Cuisine and beverage card -->
    <div class="card shadow p-4 mt-4">

      <h2 class="text-center mb-4">
        Meal Details
      </h2>

      <form onsubmit="return false;">

        <!-- Cuisine -->
        <div class="mb-3">
          <label
            for="cuisine"
            class="form-label"
          >
            Enter cuisine type
          </label>

          <input
            type="text"
            id="cuisine"
            value="Italian"
            class="form-control"
          >
        </div>


        <!-- Beverage -->
        <div class="mb-3">
          <label
            for="beverage"
            class="form-label"
          >
            Enter beverage choice
          </label>

          <input
            type="text"
            id="beverage"
            value="water"
            class="form-control"
          >
        </div>


        <!-- Update button -->
        <div class="d-grid">
          <button
            type="button"
            onclick="updateMeal()"
            class="btn btn-success"
          >
            Update the meal plan
          </button>
        </div>

      </form>

    </div>


    <!-- Results -->
    <div
      id="mealResults"
      class="alert alert-info text-center mt-4"
    >
      Your meal plan will appear here.
    </div>

  </div>

</body>
</html>
